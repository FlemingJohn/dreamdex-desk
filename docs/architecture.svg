<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Reads pass through the server to Somnia. Writes are signed in the wallet and go straight to the chain, never touching the server.">
  <title>DreamDEX Desk — how data and money move</title>

  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9BAAB5"/>
    </marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F4E4B8"/>
    </marker>
  </defs>

  <rect width="1000" height="520" fill="#0E1418"/>

  <!-- Three boxes, that is the whole story. -->
  <g font-family="'Chakra Petch', 'Trebuchet MS', sans-serif">

    <rect x="48" y="112" width="228" height="150" rx="10" fill="#161E24" stroke="#5FD3C4" stroke-width="1.5"/>
    <text x="162" y="152" font-size="21" font-weight="700" fill="#5FD3C4" text-anchor="middle">YOUR BROWSER</text>
    <text x="162" y="182" font-size="14" fill="#DCE6EC" text-anchor="middle">Dashboard + copilot</text>
    <text x="162" y="208" font-size="14" fill="#DCE6EC" text-anchor="middle">Wallet</text>
    <text x="162" y="238" font-size="13" fill="#F4E4B8" text-anchor="middle">holds the only key</text>

    <rect x="386" y="112" width="228" height="150" rx="10" fill="#161E24" stroke="#2A363F" stroke-width="1.5"/>
    <text x="500" y="152" font-size="21" font-weight="700" fill="#DCE6EC" text-anchor="middle">THE DESK</text>
    <text x="500" y="182" font-size="14" fill="#DCE6EC" text-anchor="middle">Reads the chain</text>
    <text x="500" y="208" font-size="14" fill="#DCE6EC" text-anchor="middle">Computes analytics</text>
    <text x="500" y="238" font-size="13" fill="#9BAAB5" text-anchor="middle">holds no key</text>

    <rect x="724" y="112" width="228" height="150" rx="10" fill="#161E24" stroke="#2A363F" stroke-width="1.5"/>
    <text x="838" y="152" font-size="21" font-weight="700" fill="#DCE6EC" text-anchor="middle">SOMNIA</text>
    <text x="838" y="182" font-size="14" fill="#DCE6EC" text-anchor="middle">Event contracts</text>
    <text x="838" y="208" font-size="14" fill="#DCE6EC" text-anchor="middle">Oracle settlement</text>
    <text x="838" y="238" font-size="13" fill="#9BAAB5" text-anchor="middle">the source of truth</text>
  </g>

  <!-- READS: straight through the middle. -->
  <line x1="276" y1="176" x2="386" y2="176" stroke="#9BAAB5" stroke-width="2" marker-end="url(#grey)"/>
  <line x1="614" y1="176" x2="724" y2="176" stroke="#9BAAB5" stroke-width="2" marker-end="url(#grey)"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#9BAAB5">
    <text x="331" y="164" text-anchor="middle">reads</text>
    <text x="669" y="164" text-anchor="middle">reads</text>
  </g>

  <!-- WRITES: a wide arc that visibly skips the middle box. -->
  <path d="M 150 262 C 150 400 850 400 850 262" fill="none" stroke="#F4E4B8" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#gold)"/>
  <g font-family="'Chakra Petch', sans-serif">
    <text x="500" y="382" font-size="16" font-weight="600" fill="#F4E4B8" text-anchor="middle">
      writes — signed in your wallet, straight to the chain
    </text>
    <text x="500" y="406" font-size="13" fill="#9BAAB5" text-anchor="middle">
      the desk is not in this path, so it cannot move your money
    </text>
  </g>

  <!-- Title. -->
  <g font-family="'Chakra Petch', sans-serif">
    <text x="48" y="56" font-size="13" letter-spacing="2.4" fill="#6B7B87">ARCHITECTURE</text>
    <text x="48" y="86" font-size="19" font-weight="600" fill="#DCE6EC">Data flows one way. Money flows the other.</text>
  </g>

  <!-- The rule, three columns so it reads as a sequence. -->
  <rect x="48" y="440" width="904" height="52" rx="8" fill="#131C22" stroke="#2A363F"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12.5">
    <text x="72" y="465" fill="#5FD3C4">READ</text>
    <text x="128" y="465" fill="#9BAAB5">look at anything — runs freely</text>

    <text x="72" y="483" fill="#5FD3C4">RECOVER</text>
    <text x="145" y="483" fill="#9BAAB5">cancel, merge, claim, unblock — runs when asked</text>

    <text x="516" y="465" fill="#F4E4B8">SPEND</text>
    <text x="580" y="465" fill="#DCE6EC">stops. becomes a proposal.</text>
    <text x="516" y="483" fill="#9BAAB5">needs a click, then a signature. two human acts.</text>
  </g>
</svg>
